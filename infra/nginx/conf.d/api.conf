# ── API Server (api.yourdomain.com) ─────────────────────────────────────────
# Replace yourdomain.com with your actual domain.
# This also handles WebSocket connections for Socket.IO.

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name api.yourdomain.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name api.yourdomain.com;

  ssl_certificate     /etc/nginx/ssl/api.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/api.yourdomain.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # REST API
  location / {
    proxy_pass http://server:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket (Socket.IO) — must upgrade the connection
  location /socket.io/ {
    proxy_pass http://server:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;    # Keep WS alive for long calls
  }
}
